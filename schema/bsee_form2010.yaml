# Source field map for MMS Form 2010 (BSEE Accident Investigation Report).
#
# NEITHER field numbers NOR label wording are stable across form revisions.
# An earlier version of this comment asserted numbers were stable; the
# 2026-08-29 diagnosis in docs/findings.md disproved it. Three revisions exist:
#
#   A (2004-2006, n=12)  no field 3; everything from LEASE on shifted -1
#   B (2003-2017, n=53)  fields 1-7 match; 9-16 shifted -1
#   C (2017-2026, n=38)  matches the map below
#
# The numbering below is revision C. Fields 3-16 are therefore rejected on
# revisions A and B, and their content is absorbed into the previous accepted
# field. That is P1 in docs/superpowers/plans/2026-08-29-extraction-remediation.md
# and is NOT fixed here. Every record carries `src_form_revision` so the damage
# is at least visible and testable by era.
#
# Patterns are deliberately loose — they anchor on the field number at a line
# start and use `label_hint` only to confirm, never to locate. `label_hint` may
# be a single string or a list of alternates; a list matches if ANY alternate is
# present. Typos below are BSEE's own and are reproduced on purpose
# (e.g. "RECURRANCE").
#
# `region` tells the extractor where to look:
#   form_face  - page 0, two-column, may carry checkbox sets
#   narrative  - continuation pages, single column, free prose
#   admin      - final page, two-column again

version: 1
form: "MMS Form 2010"
anchor_regex: '^\s*(\d{1,2})\s*\.\s*(.{0,80})$'

fields:
  1:  {name: occurred,               region: form_face, label_hint: "OCCURRED",                    kind: datetime_block}
  2:  {name: operator,               region: form_face, label_hint: "OPERATOR",                    kind: text}
  # Hint is the first line only: "ON SITE AT TIME OF INCIDENT" wraps to the
  # next line, so matching on it never fires.
  3:  {name: rep_on_site,            region: form_face, label_hint: "OPERATOR/CONTRACTOR",         kind: text}
  4:  {name: lease_area_block,       region: form_face, label_hint: "LEASE",                       kind: composite}
  5:  {name: platform_rig,           region: form_face, label_hint: "PLATFORM",                    kind: composite}
  6:  {name: activity,               region: form_face, label_hint: "ACTIVITY",                    kind: checkbox_set}
  7:  {name: type,                   region: form_face, label_hint: "TYPE",                        kind: checkbox_set}
  8:  {name: operation,              region: form_face, label_hint: "OPERATION",                   kind: checkbox_set}
  9:  {name: cause_checkbox,         region: form_face, label_hint: "CAUSE",                       kind: checkbox_set}
  10: {name: water_depth,            region: form_face, label_hint: "WATER DEPTH",                 kind: measure}
  11: {name: distance_from_shore,    region: form_face, label_hint: "DISTANCE FROM SHORE",         kind: measure}
  12: {name: wind,                   region: form_face, label_hint: "WIND DIRECTION",              kind: measure}
  13: {name: current,                region: form_face, label_hint: "CURRENT DIRECTION",           kind: measure}
  14: {name: sea_state,              region: form_face, label_hint: "SEA STATE",                   kind: measure}
  15: {name: pictures,               region: form_face, label_hint: "PICTURES",                    kind: text}
  16: {name: statement,              region: form_face, label_hint: "STATEMENT",                   kind: text}

  # --- the fields this project exists for ---
  # Two wordings. The pre-2010 revision reads "DESCRIBE IN SEQUENCE HOW ACCIDENT
  # HAPPENED"; the modern one reads "INVESTIGATION FINDINGS". Correlation across
  # 105 files was perfect: 81/81 located under the modern wording, 0/22 under
  # the old. Adding the alternate recovered 22 files with zero regression.
  17: {name: investigation_findings, region: narrative, kind: prose,
       label_hint: ["INVESTIGATION FINDINGS", "DESCRIBE IN SEQUENCE"],
       subheads: ["INCIDENT SUMMARY", "SEQUENCE OF EVENTS", "BSEE INVESTIGATION", "IN CONCLUSION", "CONCLUSION"]}
  18: {name: probable_cause,         region: narrative, label_hint: "PROBABLE CAUSE",              kind: cause_statements}
  19: {name: contributing_cause,     region: narrative, label_hint: "CONTRIBUTING CAUSE",          kind: cause_statements}

  20: {name: additional_information, region: narrative, label_hint: "ADDITIONAL INFORMATION",      kind: prose}
  21: {name: property_damaged,       region: narrative, label_hint: "PROPERTY DAMAGED",            kind: composite}
  22: {name: recommendations,        region: narrative, label_hint: "RECURRANCE",                  kind: prose}
  23: {name: possible_ocs_violations, region: narrative, label_hint: "POSSIBLE OCS VIOLATIONS",    kind: yesno}
  24: {name: violations_narrative,   region: narrative, label_hint: "SPECIFY VIOLATIONS",          kind: prose}

  25: {name: onsite_investigation_date, region: admin, label_hint: "DATE OF ONSITE INVESTIGATION", kind: date}
  26: {name: team_members,           region: admin,     label_hint: "Team Members",                kind: text}
  27: {name: operator_report_on_file, region: admin,    label_hint: "OPERATOR REPORT ON FILE",     kind: yesno}
  28: {name: accident_classification, region: admin,    label_hint: "ACCIDENT CLASSIFICATION",     kind: text}
  # Two rows. The label wraps as "29. ACCIDENT INVESTIGATION" / "PANEL FORMED:",
  # so a hint of "PANEL FORMED" alone never matches the anchor line, anchor 29 is
  # rejected, and field 28's value runs on into 29's content. Same shape as
  # field 17's two wordings.
  29: {name: panel_formed,           region: admin,     kind: yesno,
       label_hint: ["PANEL FORMED", "ACCIDENT INVESTIGATION"]}
  30: {name: district_supervisor,    region: admin,     label_hint: "DISTRICT SUPERVISOR",         kind: text}

# Lines matching these are page furniture, dropped before field segmentation.
# The bare-date pattern matters more than it looks: BSEE stamps an approval date
# as free-floating text that lands *inside* field 18 in visual order, e.g. a
# stray "15-JUN-2021" between a cause category and its description.
furniture_patterns:
  - '^(MMS\s*-?\s*)?FORM\s*2010\b'   # "MMS -" is sometimes split off by column detection
  - '^EV\s*2010\s*R?\b'
  - '^PAGE:?\s*\d+\s*OF\s*\d+'
  - '^For Public Release\.?$'
  - '^UNITED STATES DEPARTMENT OF THE INTERIOR$'
  - '^BUREAU OF SAFETY AND ENVIRONMENTAL ENFORCEMENT$'
  - '^GULF OF (MEXICO|AMERICA) REGION$'
  - '^ACCIDENT INVESTIGATION REPORT$'
  - '^\d{1,2}-[A-Z]{3}-\d{4}$'          # bare approval-date stamp
  - '^APPROVED$'
  - '^DATE:$'
  - '^OCS REPORT:$'

# Removed wherever they appear *within* a line, not just as a whole line. The
# "For Public Release" watermark sits on the same visual row as field labels
# ("17. INVESTIGATION FINDINGS: For Public Release") so a whole-line rule misses it.
inline_strip_patterns:
  - '\s*For Public Release\s*'

# Orphaned tails of this form's OWN field labels, which survive into fields
# 18/19 body text and then satisfy every test for a cause category: short,
# title-ish, colon-separated. In two-column soup the label wraps and its tail
# lands alone on a line —
#
#     19. LIST THE CONTRIBUTING CAUSE(S) OF
#     ACCIDENT:
#
# — so the `LIST THE ...` furniture rule in psm.causes, which needs the label
# intact, never sees it. Measured: 24 statements corpus-wide became a cause
# category named "ACCIDENT" or "OF ACCIDENT", making it the third most common
# head in the corpus and inflating the "typed but no alias" diagnostic that
# anyone extending schema/crosswalk.yaml would read.
#
# These are matched ONLY when the head is ALL CAPS. The general rule
# "all-caps head is furniture" was tested and rejected: 6 of the corpus's 11
# all-caps heads are the legitimate categories HUMAN ERROR, COMMUNICATION,
# SUPERVISION, EQUIPMENT FAILURE, MANAGEMENT SYSTEM and WORK ENVIRONMENT.
#
# This is an observed blocklist, not a derivation, and it is here rather than in
# psm/causes.py so it stays arguable and versioned.
# Sentence-level cues that mark a CONSEQUENCE statement inside the field 17
# narrative, for E19's "What was the outcome?".
#
# The obvious cues `resulting in` and `as a result` were tried first and
# REJECTED on inspection: they are causal connectors, not outcome markers, and
# fire constantly mid-narrative on cause statements ("A failed FSV allowed gas
# to migrate to the hot exhaust resulting in the fire"). They lifted recall from
# 36% to 56% and took precision with them. `resulting in` is kept ONLY when
# followed by an injury noun, where it is unambiguous.
#
# Coverage is deliberately the lesser goal here. This column is filled from
# verbatim source text, so a wrong sentence is a false `src` provenance mark --
# the one error this schema exists to prevent. Records with no confident
# sentence fall through to the xw composition in schema/xw_outcome.yaml, which
# is honestly labelled as derived.
outcome_sentence_cues:
  - 'no\s+(?:injuries|injury|one was (?:injured|hurt))'
  - '(?:was|were)\s+(?:transported|medevac\w*|air\s?lifted|flown)\s+to'
  - '(?:sustain(?:ed)|suffer(?:ed))\s+(?:a|an|two|three|multiple|minor|serious|fatal|no)\b'
  - '(?:was|were)\s+(?:fatally|seriously|severely)\s+injured'
  - '(?:was|were)\s+pronounced\s+dead'
  - '(?:was|were)\s+diagnosed\s+with'
  - '(?:resulted|resulting)\s+in\s+(?:a\s+)?(?:fatalit|injur|contusion|fracture|laceration|burn|amputat|restricted work|lost time)'
  - 'damage[sd]?\s+(?:was|were)\s+estimated'

# A candidate outside these bounds is discarded rather than truncated: a
# 20-character hit is a fragment, a 400-character one has swallowed the
# paragraph.
outcome_sentence_min_chars: 25
outcome_sentence_max_chars: 400

cause_field_furniture:
  - 'ACCIDENT'                          # tail of "...PROBABLE CAUSE(S) OF ACCIDENT"
  - 'OF ACCIDENT'                       # same label, wrapping one word earlier
  - 'PROPERTY DAMAGED'                  # field 21's label
  - 'ESTIMATED AMOUNT (TOTAL)'          # field 21's sub-label
  - 'ADDITIONAL INFORMATION FROM ITEM 22'  # field 20's label, cross-referencing 22

# --- Integrity guards -------------------------------------------------------
#
# A structured field holding paragraphs of prose is the signature of an anchor
# having been rejected: content runs anchor-to-next-anchor, so a rejected field
# is absorbed into the previous accepted one rather than failing loudly. Real
# examples from the 2026-08-29 diagnosis: a 2,356-char `f07_type`, a 2,556-char
# `f02_operator`, a 6,049-char `f30_district_supervisor` holding one name plus a
# whole crane attachment.
#
# These thresholds only ever RAISE AN ANOMALY. Nothing is truncated or repaired
# — the project's convention is that dirty data stays dirty and visible. Kinds
# absent from this map (prose, cause_statements) are legitimately unbounded.
# Calibrated against revision C, which is the only era where extraction is known
# correct — each cap sits above revision C's observed maximum with headroom, so
# a firing guard means genuine absorption rather than ordinary content. An
# earlier 400-char checkbox_set cap tripped on all 38 revision-C records
# (field 7 there runs a legitimate median of 533 chars of checkbox labels),
# which is a guard that says nothing. Revision-C maxima at calibration:
# f02 131, f06 57, f07 562, f21 409, f25 84, f27 89, f30 18.
max_length_by_kind:
  yesno: 150
  date: 120
  measure: 120
  datetime_block: 200
  checkbox_set: 700
  composite: 600
  text: 600

# --- Form revision detection ------------------------------------------------
#
# Detected from the raw anchor stream, NOT from extracted fields: on revisions A
# and B the relevant anchors are rejected by the label hints above, so by the
# time fields exist the evidence is gone.
#
# Primary discriminator is which field number carries WATER DEPTH; field 3's
# label separates A from B.
form_revisions:
  water_depth_anchor:
    10: C
    9: AB          # ambiguous, resolved by field 3
  field3_label:
    "LEASE": A
    "OPERATOR/CONTRACTOR": B

# Label text that survives INTO a field's own body, removed in place.
#
# `segment_fields` strips a field's label by cutting to the first colon on the
# first line. That fails on multi-line labels: field 22 reads
#
#     22. RECOMMENDATIONS TO PREVENT RECURRANCE
#     NARRATIVE:
#
# and field 21's "NATURE OF DAMAGE ... ESTIMATED AMOUNT" block linearises
# BETWEEN the two halves, so the first line carries no colon and nothing is
# stripped. Measured 2026-08-29: 34.3% of non-empty field-22 values began with
# their own label. This is NOT the terminal-anchor sink -- field 30 is correctly
# located on 322 of the 369 affected records.
#
# Removed IN PLACE, not by cutting to a terminator: the body is split around the
# interleaved block ("The Houma District has no recommendation | NATURE OF
# DAMAGE: Ruptured, melted | NARRATIVE: | for the Regional Office."), so
# everything-before-NARRATIVE would delete real text.
#
# Deliberately conservative. `NATURE OF DAMAGE` and its amount belong to field
# 21 and are extracted there too, but their extent inside field 22 cannot be
# bounded without the column-band work, so only the label token is removed and
# the value it introduces is left visible rather than half-deleted.
label_bleed_patterns:
  - '\d{0,2}\s*\.?\s*RECOMMENDATIONS\s+TO\s+PREVENT\s+RECURRANCE'
  - '\bNARRATIVE\s*[:''"]?'
  - '\bNATURE\s+OF\s+DAMAGE\s*:?'
  - '\bESTIMATED\s+AMOUNT\s*\(?TOTAL\)?\s*:?'
  - '\bLIST\s+THE\s+(?:PROBABLE|CONTRIBUTING)\s+CAUSE\(?S\)?\s+OF(?:\s+ACCIDENT)?\s*:?'
  - '\bLIST\s+THE\s+ADDITIONAL\s+INFORMATION\s*:?'
