# BSEE cause category -> Energy Institute PSM Framework element.
#
# THIS FILE IS AN OPINION, NOT A FACT. It is data, not code, precisely so you
# can disagree with it in a pull request without touching Python.
#
# Elements are referenced BY NUMBER ONLY. The Energy Institute's framework is a
# copyrighted publication of a UK professional body and we could not verify its
# terms of use (energyinst.org returned 403 to every request). Since the ML task
# keys on element number, being careful costs us nothing. See DATA_SOURCES.md.
#
# Applied by src/psm/crosswalk.py. Output columns take the `xw_` prefix.

version: 1
target_framework: "Energy Institute PSM Framework"
target_element_reference: "by number only"
source_vocabulary: "BSEE MMS Form 2010, fields 18/19 (induced 2026-08-02, n=63)"

# Confidence is about the MAPPING, not the extraction:
#   high   - the category names the element's subject matter directly
#   medium - defensible, but a reasonable person could route it elsewhere
#   low    - genuinely contested; expect argument
categories:

  Equipment Failure:
    primary_element: 7
    also_touches: [10]
    confidence: high
    note: >
      Asset integrity / mechanical integrity. Routed to 7 because the failures
      observed are overwhelmingly maintenance, inspection and repair adequacy
      rather than design. Where the statement names design specifically
      ("Flawed equipment design or construction") element 10 is the better fit,
      which is why this is a two-element entry rather than one.

  Human Performance Error:
    primary_element: 13
    also_touches: [12]
    confidence: medium
    note: >
      Contested by design. "Human error" as a cause category is itself
      disputed in modern process-safety thinking - it often encodes a systemic
      failure as an individual one. We map it to competence/human factors
      rather than to a discipline element, and flag it. Reviewers who believe
      these should route to procedures (12) have a real argument.
      Surface variants: "Human Performance Error" (dominant), "Human error",
      "Human performance error". Normalise before lookup.

  Management Systems:
    primary_element: 3
    also_touches: [1]
    confidence: medium
    note: >
      The broadest and least precise BSEE category - observed subcategories
      range from "No written job procedures" to "Inadequate hazards analysis",
      which belong to different elements. Routed to the management-system
      element as the least-wrong single destination. This is the entry most
      likely to need splitting once level-2 subcategories are pinned down.

  Communication:
    primary_element: 12
    also_touches: [3]
    confidence: medium
    note: >
      Observed subcategories are about shift handover, operator-to-contractor
      instruction, and job briefing adequacy - i.e. procedural and
      organisational communication rather than emergency communication.

  Supervision:
    primary_element: 13
    also_touches: [3]
    confidence: medium
    note: >
      Appears both as "Supervision" and "No Supervision". Adjacent to Human
      Performance Error and routed to the same element; separated here because
      BSEE separates them and collapsing them would destroy signal the source
      chose to preserve.

  Work Environment:
    primary_element: 10
    also_touches: [7]
    confidence: low
    note: >
      Weakest mapping in this file. Observed statements mix workplace layout
      ("Poor layout or design of work area"), weather, and marine environment.
      Layout is a design concern; weather is arguably not a PSM element failure
      at all. Low confidence is the honest label - do not treat xw_ output for
      this category as reliable.

# Statements carrying a level-2 subcategory with no parent category (18% of
# typed statements, all singletons at n=63). Not mapped: inferring the parent
# from the subcategory is exactly the kind of quiet guess this repo avoids.
# These get xw_element = null and xw_unmapped_reason = "orphan_subcategory".
orphan_subcategory_policy: leave_unmapped

# Free-text-era statements (74% of 2014-2021 reports) carry no category at all.
# They get xw_element = null and xw_unmapped_reason = "untyped_freetext".
# They are candidates for llm_ labelling - never for xw_.
untyped_policy: leave_unmapped
