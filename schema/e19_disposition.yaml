# Per-field disposition for every column of the E19 projection.
#
# ===========================================================================
# WHY THIS FILE EXISTS
#
# "The dataset is 38% full" is a meaningless number and was, for weeks, the only
# one available. Most empty cells in these tables are empty because a BSEE
# investigation report structurally cannot answer the question -- a federal
# investigator does not record the operator's internal close-out approver, or
# the date their action tracker says the recommendation was completed. Those
# blanks are not gaps. They are the shape of the source.
#
# Mixed in among them were a handful of genuinely fillable columns nobody had
# got to. The two kinds of blank were indistinguishable, so no one -- not a
# hackathon entrant, not the template's author, not us -- could tell whether
# the project had failed or the source was silent.
#
# This file separates them, so the headline becomes
#
#     percent of OBTAINABLE fields filled
#
# which is a claim a stranger can check, rather than a number that flatters or
# maligns depending on how you read it.
#
# `src/psm/ledger.py` joins this to measured coverage. `tests/test_ledger.py`
# makes it self-policing: a field marked `not_obtainable` that starts carrying
# data, or a field marked `filled` that goes to zero, fails the build. A
# disposition is a claim about the world, and claims here are tested.
# ===========================================================================

version: 1
measured: "2026-08-29, against data/processed/e19/ at commit f8d02e8"

# --- The five dispositions -------------------------------------------------
dispositions:
  filled: >
    Carries data now, from `src` or `xw`. Coverage may be partial -- partial is
    recorded, not hidden. Counts toward the numerator and the denominator.
  synthetic: >
    BSEE cannot supply it, but the field describes a workflow whose SHAPE is
    reproducible, so src/psm/synth.py scaffolds it under a `syn_` mark. Counts
    toward the denominator only once wired in; until then it is honest debt.
  needs_human: >
    A person must decide. Not a coverage failure and not fixable by extraction.
    EXCLUDED from the denominator -- it is the labelling backlog, tracked
    separately in gold/.
  deliberate_blank: >
    We could fill it and chose not to, with the reason on record in a schema
    file. EXCLUDED from the denominator; leaving it blank is the deliverable.
  not_obtainable: >
    BSEE structurally does not contain it and no scaffold is appropriate.
    EXCLUDED from the denominator. This is the list the template's author needs:
    the fields only his organisation's records can fill.

# --- Fields, keyed table.label ---------------------------------------------
# `label` is byte-exact from the workbook, irregular whitespace included.

fields:

  # ===== incidents ==========================================================
  incidents:
    "Incident Number":        {disposition: filled, note: "constructed key; BSEE publishes no incident identifier"}
    "Date of Incident":       {disposition: filled}
    "Time of Incident":       {disposition: filled}
    "Site":                   {disposition: filled, note: "vocabulary_exempt; BSEE area code substituted for the template's placeholder"}
    "Area":                   {disposition: filled, note: "vocabulary_exempt; BSEE block number"}
    "Unit":                   {disposition: filled, note: "vocabulary_exempt; BSEE platform designator"}
    "Detail":                 {disposition: filled}
    "Description":            {disposition: filled}
    "What happened?  ":       {disposition: filled}
    "What was the outcome?":  {disposition: filled, note: "two tiers: verbatim field 17 sentence (src) then xw_outcome.yaml composition"}
    "How did the incident occur":
      disposition: filled
      note: >
        19.5% and capped there by the source. Requires a SEQUENCE OF EVENTS
        heading; falling back to the whole narrative would duplicate
        "What happened?" into both columns and imply a separation the document
        does not make.
    "Investigation leader - Name":                      {disposition: filled}
    "Investigation Acceptor/Approver (Owner) - Name":    {disposition: filled}
    "Investigation Acceptor/Approver (Owner)- Position": {disposition: filled}
    "Incident Classificatioin":  {disposition: filled, note: "xw from risk score; NOT BSEE field 28, whose MAJOR/MINOR vocabulary is different"}
    "Incident Classification":   {disposition: filled}
    "Incident Type A":           {disposition: filled}
    "Incident Type B":           {disposition: filled}
    "Incident Type C":           {disposition: filled}
    "Incident Type D":           {disposition: filled, note: "18.4%; most atoms map to a deliberate null rather than a guess"}
    "Health & Safety  - Consequence":            {disposition: filled}
    "Health & Safety - Likelihood":              {disposition: filled}
    "Health & Safety - Risk Score":              {disposition: filled}
    "Health & Safety Incident - Classification": {disposition: filled}
    "Environment & Reputation  - Consequence":              {disposition: filled}
    "Financial Cost & Business Interruption  - Consequence": {disposition: filled, note: "from field 21's real dollar figure; basis is ACTUAL, unlike the H&S column"}

    "incident Title":                    {disposition: synthetic, generator: syn_incident_title}
    "Date of Report":                    {disposition: synthetic, generator: syn_date_of_report}
    "Approval Date":                     {disposition: synthetic, generator: syn_approval_date}
    "Close out Date":                    {disposition: synthetic, generator: syn_close_out_date}
    "Investigation leader - Position":   {disposition: synthetic, generator: syn_investigation_lead_position}
    "Incident Classified by - Name":     {disposition: synthetic, generator: syn_incident_classified_by_name}
    "Incident Classified by - Position": {disposition: synthetic, generator: syn_incident_classified_by_position}
    "Close out Approval - Name":         {disposition: synthetic, generator: syn_close_out_approval_name}
    "Close out Approval - Position":     {disposition: synthetic, generator: syn_close_out_approval_position}

    "Work Group":
      disposition: not_obtainable
      note: >
        Six of the picklist's twelve values are one company's named shift crews.
        Prose inference measured at ~16% recall and ~30% precision for the
        question actually asked -- most matches are the injured person's trade or
        a post-incident actor. See schema/e19_projection.yaml for the full note
        and for the picklist extension that would make it fillable.

    "What was the worst outcome that could reasonably be expected to have happened?":
      disposition: deliberate_blank
      reason_recorded_in: schema/xw_consequence_tiers.yaml
      note: "The consequence letter is derivable; the sentence describing it is not."
    "Environment & Reputation - Likelihood":
      disposition: deliberate_blank
      reason_recorded_in: schema/xw_consequence_tiers.yaml
      note: "Mechanism rates measure injury, not release volume. A separate empirical pass, not done."
    "Environment & Reputation - Risk Score":
      disposition: deliberate_blank
      reason_recorded_in: schema/xw_consequence_tiers.yaml
      note: "Depends on the likelihood above."
    "Environment & Reputation - Incident Classification":
      disposition: deliberate_blank
      reason_recorded_in: schema/xw_consequence_tiers.yaml
      note: "Depends on the risk score above."
    "Financial Cost & Business Interruption - Likelihood":
      disposition: deliberate_blank
      reason_recorded_in: schema/xw_consequence_tiers.yaml
      note: "Damage cost is recorded as an actual; no conditional probability of cost given mechanism has been measured."
    "Financial Cost & Business Interruption - Risk Score":
      disposition: deliberate_blank
      reason_recorded_in: schema/xw_consequence_tiers.yaml
      note: "Depends on the likelihood above."
    "Financial Cost & Business - Incident Classification":
      disposition: deliberate_blank
      reason_recorded_in: schema/xw_consequence_tiers.yaml
      note: "Depends on the risk score above."

  # ===== causes =============================================================
  causes:
    "Incident Number":   {disposition: filled, note: "foreign key"}
    "Cause number":      {disposition: filled, note: "ordinal"}
    "Cause Description": {disposition: filled}
    "Risk Management Cause":
      disposition: filled
      note: "7.6%. Low because only ~a third of statements name a subcategory; the rest are prose."
    "Human Factors  Cause":
      disposition: filled
      note: "4.2%. Graded, with per-cell confidence in causes_confidence.csv."
    " Failed PSM Framework Element":
      disposition: filled
      note: >
        14.4%, and the single most contested column in the project. The mapping
        is six lines of schema/crosswalk.yaml and has never been validated
        against an independent human judgement -- see gold/ and R5.
    "Cause type":
      disposition: needs_human
      note: >
        Immediate / Underlying / Root. BSEE's field 18 vs 19 split is an axis of
        PRIMACY (probable vs contributing), not the axis of DEPTH this column
        asks for. The sidecar preserves which field each statement came from, so
        the feature is available to a later pass, but the two axes are not the
        same and must not be equated.

  # ===== recommendations ====================================================
  recommendations:
    "Incident Number":            {disposition: filled, note: "foreign key"}
    "Recommendation Number":      {disposition: filled, note: "ordinal"}
    "Recommendation Description": {disposition: filled}
    "Agreed Completion Date":     {disposition: synthetic, generator: syn_agreed_completion_date}
    "Responsible Owner - Name":   {disposition: synthetic, generator: syn_responsible_owner_name}
    "Responsible Owner - Position": {disposition: synthetic, generator: syn_responsible_owner_position}
    "Unmittigated Risk - Score":  {disposition: synthetic, generator: syn_unmitigated_risk_score}
    "Mittigated Risk - Score":    {disposition: synthetic, generator: syn_mitigated_risk_score}
    # NOTE: synth.py generates the two SCORES but not their component
    # consequence and likelihood. Listed as synthetic because that is what they
    # are, with the generator absent and named as absent rather than quietly
    # omitted from this file.
    "Unmittigated Risk - Consequence": {disposition: synthetic, generator: null}
    "Unmittigated Risk - Likelihood":  {disposition: synthetic, generator: null}
    "Mittigated Risk - Consequence":   {disposition: synthetic, generator: null}
    "Mittigated Risk - Likelihood":    {disposition: synthetic, generator: null}

  # ===== closeout ===========================================================
  closeout:
    "Incident Number":       {disposition: filled, note: "foreign key"}
    "Recommendation Number": {disposition: filled, note: "foreign key"}
    "Schedule Status":       {disposition: synthetic, generator: syn_schedule_status}
    "Date Completed":        {disposition: synthetic, generator: syn_action_due_date}
