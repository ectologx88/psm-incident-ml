# Per-field disposition for every column of the E19 projection.
#
# ===========================================================================
# WHY THIS FILE EXISTS
#
# "The dataset is 38% full" is a meaningless number and was, for weeks, the only
# one available. Most empty cells in these tables are empty because a BSEE
# investigation report structurally cannot answer the question -- a federal
# investigator does not record an operator's internal close-out approver, or the
# date an action tracker says a recommendation was completed. Those blanks are
# not gaps. They are the shape of the source.
#
# THIS IS A SELF-CONTAINED PUBLIC DATASET. There is no template author to ask
# and no organisation whose records could supply the missing columns. An earlier
# version of this file was written as though there were, and treated some blanks
# as somebody else's to fill. Nobody else is coming. Every cell the source
# cannot supply is either fabricated under a `syn` mark or stays empty, and this
# file records which, per column.
#
# So the headline is not "percent complete" -- the sheet is dense by
# construction. It is:
#
#     what fraction of this dataset is REAL
#
# which is the only number that tells a stranger what they can model on.
#
# `src/psm/ledger.py` joins this to measured coverage. `tests/test_ledger.py`
# makes it self-policing: a field marked `not_obtainable` that starts carrying
# data, or a field marked `filled` that goes to zero, fails the build. A
# disposition is a claim about the world, and claims here are tested.
# ===========================================================================

version: 1
measured: "2026-08-29, against data/processed/e19/ at commit f8d02e8"

# --- The three dispositions ------------------------------------------------
#
# Reduced from five on 2026-08-29. `needs_human`, `deliberate_blank` and
# `not_obtainable` all encoded "somebody else fills this, or nobody does". With
# no author and a dense sheet as the goal, they collapse into synthesis. The
# REASONS they were distinct are kept as notes -- a column that is fabricated
# because the source is structurally silent is a different animal from one
# fabricated because our method declined to estimate, and a reader deserves to
# know which.
dispositions:
  real: >
    Carries `src` or `xw` values where the source supports them. Coverage is
    partial for most of these, and the gaps are handled by the column's
    `gap_policy` below.
  synthetic_column: >
    No real counterpart exists anywhere in the source. The whole column is
    fabricated under a `syn` mark. Safe to fabricate precisely BECAUSE it is
    uniform: nothing here is ever confusable with a fact about a real incident.

# Every `real` column also carries a `gap_policy`, because a real column is
# rarely full and what happens in its empty cells is the whole question:
gap_policies:
  none: >
    The column is structurally complete -- a key, an ordinal, or a field BSEE
    always records. Nothing to fill.
  fabricate: >
    Empty cells are filled synthetically. This is the DANGEROUS case and is
    named rather than implied: a `syn` value ends up in the SAME COLUMN as `src`
    and `xw` values, describing the SAME REAL INCIDENT, and only
    enriched/provenance.csv tells them apart. `Incident Type D` is 18.4% real,
    so four cells in five will be invented -- each one asserting a mechanism for
    a named incident at a named block on a named date that BSEE never asserted.
    That is defensible for a synthetic dataset and indefensible if the marking
    is ever lost. Anything downstream that treats these columns as ground truth
    must filter on provenance first: `psm.ledger --real-only`.

# --- Fields, keyed table.label ---------------------------------------------
# `label` is byte-exact from the workbook, irregular whitespace included.
#
# `modelling_target: true` marks a column whose value is something a hackathon
# entrant would plausibly try to PREDICT. Fabricating gaps in these is what
# turns a dataset into a machine for learning its own generator, so they are
# flagged here and excluded by the --real-only export.

fields:

  # ===== incidents ==========================================================
  incidents:

    # --- real: identity, place, time, narrative --------------------------
    "Incident Number":  {disposition: real, gap_policy: none, note: "constructed key; BSEE publishes no incident identifier"}
    "Date of Incident": {disposition: real, gap_policy: fabricate}
    "Time of Incident": {disposition: real, gap_policy: fabricate}
    "Site":   {disposition: real, gap_policy: fabricate, note: "vocabulary_exempt; BSEE area code replaces the template's placeholder facility names"}
    "Area":   {disposition: real, gap_policy: fabricate, note: "vocabulary_exempt; BSEE block number"}
    "Unit":   {disposition: real, gap_policy: fabricate, note: "vocabulary_exempt; BSEE platform designator"}
    "Detail": {disposition: real, gap_policy: fabricate}
    "Description":      {disposition: real, gap_policy: fabricate}
    "What happened?  ": {disposition: real, gap_policy: fabricate}
    "What was the outcome?":
      disposition: real
      gap_policy: fabricate
      note: "Two tiers already: verbatim field 17 sentence (src), then xw_outcome.yaml composition."
    "How did the incident occur":
      disposition: real
      gap_policy: fabricate
      note: >
        19.5%, capped by the source: it requires a SEQUENCE OF EVENTS heading,
        and falling back to the whole narrative would duplicate "What happened?"
        into both columns and imply a separation the document does not make.
    "Investigation leader - Name":                       {disposition: real, gap_policy: fabricate}
    "Investigation Acceptor/Approver (Owner) - Name":     {disposition: real, gap_policy: fabricate}
    "Investigation Acceptor/Approver (Owner)- Position":  {disposition: real, gap_policy: fabricate}

    # --- real AND a plausible modelling target ---------------------------
    # Fabricating gaps here is the risky move. Kept dense per the dataset's
    # design, and excluded wholesale by `psm.ledger --real-only`.
    "Incident Type A": {disposition: real, gap_policy: fabricate, modelling_target: true}
    "Incident Type B": {disposition: real, gap_policy: fabricate, modelling_target: true}
    "Incident Type C": {disposition: real, gap_policy: fabricate, modelling_target: true}
    "Incident Type D":
      disposition: real
      gap_policy: fabricate
      modelling_target: true
      note: "18.4% real. Most atoms map to a deliberate null rather than a guess, so 81.6% of this column will be syn."
    "Incident Classificatioin":
      disposition: real
      gap_policy: fabricate
      modelling_target: true
      note: "xw from the risk score. NOT BSEE field 28, whose MAJOR/MINOR vocabulary is a different scale."
    "Incident Classification":                    {disposition: real, gap_policy: fabricate, modelling_target: true}
    "Health & Safety  - Consequence":             {disposition: real, gap_policy: fabricate, modelling_target: true}
    "Health & Safety - Likelihood":               {disposition: real, gap_policy: fabricate, modelling_target: true}
    "Health & Safety - Risk Score":               {disposition: real, gap_policy: fabricate, modelling_target: true}
    "Health & Safety Incident - Classification":  {disposition: real, gap_policy: fabricate, modelling_target: true}
    "Environment & Reputation  - Consequence":    {disposition: real, gap_policy: fabricate, modelling_target: true}
    "Financial Cost & Business Interruption  - Consequence":
      disposition: real
      gap_policy: fabricate
      modelling_target: true
      note: "From field 21's real dollar figure. Basis is ACTUAL, unlike the H&S column, which is potential."

    # --- synthetic columns: the investigation workflow -------------------
    # No real counterpart anywhere in a federal report. Uniform fabrication,
    # and safe precisely because it is uniform.
    "incident Title":                    {disposition: synthetic_column, generator: syn_incident_title}
    "Date of Report":                    {disposition: synthetic_column, generator: syn_date_of_report}
    "Approval Date":                     {disposition: synthetic_column, generator: syn_approval_date}
    "Close out Date":                    {disposition: synthetic_column, generator: syn_close_out_date}
    "Investigation leader - Position":   {disposition: synthetic_column, generator: syn_investigation_lead_position}
    "Incident Classified by - Name":     {disposition: synthetic_column, generator: syn_incident_classified_by_name}
    "Incident Classified by - Position": {disposition: synthetic_column, generator: syn_incident_classified_by_position}
    "Close out Approval - Name":         {disposition: synthetic_column, generator: syn_close_out_approval_name}
    "Close out Approval - Position":     {disposition: synthetic_column, generator: syn_close_out_approval_position}

    "Work Group":
      disposition: synthetic_column
      generator: null
      note: >
        Was `not_obtainable`. Six of the picklist's twelve values are one
        company's named shift crews, so nothing real can go here -- but with no
        organisation to defer to, an openly `syn` value is better than a blank.
        NOT filled by inference from field 17 prose, which measured ~16% recall
        at ~30% precision: most matches are the injured person's trade or a
        post-incident actor. A 30%-precision guess carrying an `xw` mark would
        be a false claim about a real incident; a `syn` value is not.

    # --- synthetic columns: risk judgements our method declined -----------
    # These were `deliberate_blank`. The reason each was left empty is still
    # true and still recorded; what changed is that "leave it blank" is no
    # longer an option when the sheet must be dense. The methodological
    # objection now lives in the note rather than in the emptiness.
    "What was the worst outcome that could reasonably be expected to have happened?":
      disposition: synthetic_column
      generator: syn_worst_reasonable_outcome
      reason_recorded_in: schema/xw_consequence_tiers.yaml
      note: "The consequence letter is derivable; the sentence describing it is not."
    "Environment & Reputation - Likelihood":
      disposition: synthetic_column
      generator: null
      reason_recorded_in: schema/xw_consequence_tiers.yaml
      note: "Mechanism rates measure injury, not release volume. No empirical pass was done."
    "Environment & Reputation - Risk Score":
      disposition: synthetic_column
      generator: syn_environment_reputation_score
      reason_recorded_in: schema/xw_consequence_tiers.yaml
      note: "Depends on the likelihood above."
    "Environment & Reputation - Incident Classification":
      disposition: synthetic_column
      generator: syn_environment_reputation_classification
      reason_recorded_in: schema/xw_consequence_tiers.yaml
      note: "Depends on the risk score above."
    "Financial Cost & Business Interruption - Likelihood":
      disposition: synthetic_column
      generator: null
      reason_recorded_in: schema/xw_consequence_tiers.yaml
      note: "Damage cost is recorded as an actual; no conditional probability of cost given mechanism has been measured."
    "Financial Cost & Business Interruption - Risk Score":
      disposition: synthetic_column
      generator: syn_financial_score
      reason_recorded_in: schema/xw_consequence_tiers.yaml
      note: "Depends on the likelihood above."
    "Financial Cost & Business - Incident Classification":
      disposition: synthetic_column
      generator: syn_financial_classification
      reason_recorded_in: schema/xw_consequence_tiers.yaml
      note: "Depends on the risk score above."

  # ===== causes =============================================================
  causes:
    "Incident Number":   {disposition: real, gap_policy: none, note: "foreign key"}
    "Cause number":      {disposition: real, gap_policy: none, note: "ordinal"}
    "Cause Description": {disposition: real, gap_policy: none, note: "100%; this column IS the dataset's primary input feature"}

    # Every remaining causes column is a label over Cause Description, which
    # makes all four modelling targets and makes fabricating their gaps the
    # single most consequential decision in this file. At 14.4% real, the PSM
    # element column becomes ~86% syn. Anyone training on it without filtering
    # provenance is learning schema/synth_rules.yaml.
    " Failed PSM Framework Element":
      disposition: real
      gap_policy: fabricate
      modelling_target: true
      note: >
        14.4% real, and the most contested column in the project. The mapping is
        six lines of schema/crosswalk.yaml and has never been validated against
        an independent human judgement -- see gold/ and R5.
    "Risk Management Cause":
      disposition: real
      gap_policy: fabricate
      modelling_target: true
      note: "7.6% real. Low because only about a third of statements name a subcategory; the rest are prose."
    "Human Factors  Cause":
      disposition: real
      gap_policy: fabricate
      modelling_target: true
      note: "4.2% real. Graded, with per-cell confidence in causes_confidence.csv."
    "Cause type":
      disposition: synthetic_column
      generator: null
      modelling_target: true
      note: >
        Was `needs_human`. Immediate / Underlying / Root. BSEE's field 18 vs 19
        split is an axis of PRIMACY (probable vs contributing), not the axis of
        DEPTH this column asks for; the sidecar preserves which field each
        statement came from, so the feature is available, but the two axes are
        not the same and must not be equated. 100% syn.

  # ===== recommendations ====================================================
  recommendations:
    "Incident Number":            {disposition: real, gap_policy: none, note: "foreign key"}
    "Recommendation Number":      {disposition: real, gap_policy: none, note: "ordinal"}
    "Recommendation Description": {disposition: real, gap_policy: none, note: "100%; real prose from BSEE field 22"}
    "Agreed Completion Date":       {disposition: synthetic_column, generator: syn_agreed_completion_date}
    "Responsible Owner - Name":     {disposition: synthetic_column, generator: syn_responsible_owner_name}
    "Responsible Owner - Position": {disposition: synthetic_column, generator: syn_responsible_owner_position}
    "Unmittigated Risk - Score":    {disposition: synthetic_column, generator: syn_unmitigated_risk_score}
    "Mittigated Risk - Score":      {disposition: synthetic_column, generator: syn_mitigated_risk_score}
    # synth.py generates the two SCORES but not their component consequence and
    # likelihood. Named as absent rather than quietly omitted from this file.
    "Unmittigated Risk - Consequence": {disposition: synthetic_column, generator: null}
    "Unmittigated Risk - Likelihood":  {disposition: synthetic_column, generator: null}
    "Mittigated Risk - Consequence":   {disposition: synthetic_column, generator: null}
    "Mittigated Risk - Likelihood":    {disposition: synthetic_column, generator: null}

  # ===== closeout ===========================================================
  closeout:
    "Incident Number":       {disposition: real, gap_policy: none, note: "foreign key"}
    "Recommendation Number": {disposition: real, gap_policy: none, note: "foreign key"}
    "Schedule Status":       {disposition: synthetic_column, generator: syn_schedule_status}
    "Date Completed":        {disposition: synthetic_column, generator: syn_action_due_date}
